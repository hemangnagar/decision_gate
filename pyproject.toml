[project]
name = "decision-gate"
version = "0.2.0"
description = "Adversarial decision ledger with bounded review and deterministic ACT/WAIT/ABANDON gates"
requires-python = ">=3.11"

[project.optional-dependencies]
llm = ["litellm"]

[project.scripts]
decision-gate = "decision_gate.cli:main"
decision-gate-web = "decision_gate.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
